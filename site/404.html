<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - Eclipse</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#141413">
  <meta name="color-scheme" content="dark">
  <!-- Served for any missing path at any depth, so every URL is absolute. -->
  <link rel="icon" href="/Eclipse/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/Eclipse/assets/css/style.css">
  <style>
    .lost { min-height: 100vh; min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 1.1rem; padding: 2rem; text-align: center; }
    .lost img { width: 3.5rem; height: 3.5rem; margin-bottom: 0.5rem; }
    .lost h1 { font: 400 clamp(2.2rem, 1.5rem + 2vw, 3.2rem)/1.1 var(--serif); letter-spacing: -0.02em; }
    .lost p { color: var(--muted); max-width: 26rem; }
    .lost .btn { margin-top: 0.9rem; }
  </style>
</head>
<body>
  <main class="lost">
    <img src="/Eclipse/assets/img/logo-320.webp" width="56" height="56" alt="Eclipse">
    <h1>Page not found</h1>
    <p>This page does not exist. Everything Eclipse has is on the home page.</p>
    <a class="btn btn--primary" href="/Eclipse/">Back to Eclipse</a>
  </main>
</body>
</html>
